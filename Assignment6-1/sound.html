<!-- CSC102 - Assignment 6.1: Incorporate Sound -->
<!-- The sound file panel-hum.mp3 is a sound I made myself, so it is not copyrighted. -->

<!-- Tells the browser this is an HTML5 page -->
<!DOCTYPE html>

<!-- Start of the html page -->
<html lang="en">

<!-- The head holds information about the page -->
<head>

    <!-- Sets the character encoding so text shows up right -->
    <meta charset="UTF-8">

    <!-- Makes the page fit on a phone screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The title that shows on the browser tab -->
    <title>Panel Room Sound Page</title>

    <!-- Creative element 1: a Google Font called Oswald -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&display=swap" rel="stylesheet">

    <!-- All of my CSS styling goes in here -->
    <style>

        /* Creative element 2: a dark navy background color for the whole page */
        body {
            /* takes off the default space around the edge of the page */
            margin: 0;
            /* adds space so nothing touches the edges */
            padding: 30px;
            /* the Google Font I loaded above, with backups if it does not load */
            font-family: "Oswald", Arial, sans-serif;
            /* navy background color */
            background-color: #0B1F3A;
            /* light text color so it can be read on the navy */
            color: #E6EAF2;
            /* centers everything on the page */
            text-align: center;
        }

        /* the box that holds all of my content */
        .card {
            /* keeps the box from getting too wide on a big screen */
            max-width: 640px;
            /* centers the box left to right */
            margin: 0 auto;
            /* space inside the box */
            padding: 25px;
            /* a slightly lighter navy so the box stands out */
            background-color: #123156;
            /* a gold border around the box */
            border: 2px solid #C9A227;
            /* rounds the corners of the box */
            border-radius: 10px;
        }

        /* Creative element 3: my lightning bolt image */
        img {
            /* makes the image 90 pixels wide */
            width: 90px;
        }

        /* the main heading */
        h1 {
            /* gold color for the heading */
            color: #C9A227;
            /* makes the heading bigger */
            font-size: 32px;
            /* space above and below the heading */
            margin: 10px 0;
        }

        /* the paragraph text */
        p {
            /* a comfortable size to read */
            font-size: 16px;
            /* thin weight from the Oswald font */
            font-weight: 300;
            /* space between the lines */
            line-height: 1.6;
        }

        /* the black box that holds the moving bars */
        #meter {
            /* lines the bars up in a row */
            display: flex;
            /* makes the bars grow up from the bottom */
            align-items: flex-end;
            /* how tall the box is */
            height: 90px;
            /* space inside the box */
            padding: 10px;
            /* a dark background so the gold bars show up */
            background-color: #071528;
            /* rounds the corners */
            border-radius: 8px;
            /* space above and below the box */
            margin: 20px 0;
        }

        /* one single bar inside the meter box */
        .bar {
            /* every bar takes up an equal share of the width */
            width: 100%;
            /* the starting height before my JavaScript changes it */
            height: 5%;
            /* gold bars */
            background-color: #C9A227;
            /* a small gap between each bar */
            margin: 0 3px;
            /* rounds the top of the bar */
            border-radius: 3px;
            /* makes the bar slide to its new height instead of jumping */
            transition: height 0.2s;
        }

        /* the power button */
        button {
            /* makes the button big enough to click easily */
            padding: 12px 25px;
            /* same font as the rest of the page */
            font-family: "Oswald", Arial, sans-serif;
            /* readable text size on the button */
            font-size: 16px;
            /* navy text on the gold button */
            color: #0B1F3A;
            /* gold button color */
            background-color: #C9A227;
            /* takes off the default button border */
            border: none;
            /* rounds the button corners */
            border-radius: 6px;
            /* shows the hand cursor so people know to click it */
            cursor: pointer;
        }

        /* changes the button color when the mouse is over it */
        button:hover {
            /* a lighter gold on hover */
            background-color: #E8C55A;
        }

        /* the volume slider */
        input {
            /* how wide the slider is */
            width: 160px;
            /* makes the slider gold instead of blue */
            accent-color: #C9A227;
        }

        /* the line where my messages get printed */
        #message {
            /* gold text so the message stands out */
            color: #C9A227;
            /* keeps the box the same height so the page does not jump */
            min-height: 24px;
        }

    </style>

<!-- End of the head -->
</head>

<!-- The body holds everything you can see -->
<body>

    <!-- This is my background sound. The loop attribute makes it start over when it ends. -->
    <audio id="backgroundSound" src="panel-hum.mp3" loop></audio>

    <!-- The box that holds my page content -->
    <div class="card">

        <!-- My lightning bolt image -->
        <img src="bolt.png" alt="Gold lightning bolt">

        <!-- The main heading of my page -->
        <h1>Panel Room</h1>

        <!-- A paragraph telling the user what the page does -->
        <p>
            I used to work in electrical rooms, so I made a sound that hums like one.
            Press the button to turn it on and use the slider to set how loud it is.
        </p>

        <!-- The box where my JavaScript draws the moving bars -->
        <div id="meter"></div>

        <!-- The button that turns the sound on and off. It calls a function in sound.js. -->
        <button onclick="toggleSound();" id="powerButton">Turn sound on</button>

        <!-- The volume slider. It sends its own value to a function in sound.js. -->
        <p>
            <!-- The word Volume in front of the slider -->
            Volume
            <!-- The slider itself, going from 0 to 100 and starting at 50 -->
            <input type="range" min="0" max="100" value="50" oninput="changeVolume(this.value);">
        </p>

        <!-- This shows how long the sound has been playing -->
        <p>Time playing: <span id="timer">00:00</span></p>

        <!-- This is where my JavaScript prints messages to the user. -->
        <!-- If this text never changes, it means sound.js did not load. -->
        <p id="message">Waiting for sound.js to load...</p>

    <!-- End of the box -->
    </div>

    <!-- Loads my JavaScript file. All of my functions are in there, not in this file. -->
    <script src="sound.js"></script>

<!-- End of the body -->
</body>

<!-- End of the page -->
</html>
