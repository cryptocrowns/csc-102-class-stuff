<!-- ============================================================ -->
<!-- Palindrome Checker                                          -->
<!-- Name: Larry Douglas                                         -->
<!-- Course: CSC102 - Introduction to Programming                -->
<!-- Purpose: ask the user for a word or phrase, tell them if it -->
<!--          reads the same forward and backward, then let them -->
<!--          keep going or exit the loop.                       -->
<!-- Creative elements: (1) custom Google font pairing,          -->
<!--   (2) navy/gold gradient theme with a glowing panel,        -->
<!--   (3) letter tiles that light up as matched pairs.          -->
<!-- ============================================================ -->

<!-- tells the browser this page is written in modern HTML5 -->
<!DOCTYPE html>
<!-- opens the page and sets the language to English -->
<html lang="en">

<!-- the head holds settings and styling, not visible content -->
<head>
    <!-- sets the character set so accents and symbols display correctly -->
    <meta charset="UTF-8">
    <!-- makes the page scale properly on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- the text that shows on the browser tab -->
    <title>Palindrome Checker</title>

    <!-- CREATIVE ELEMENT 1: custom fonts pulled in from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- second preconnect required by Google Fonts for the font files themselves -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- loads Cinzel for headings and Poppins for body text -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- all of the styling for the page lives in this style block -->
    <style>
        /* resets spacing so every browser starts from the same place */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* CREATIVE ELEMENT 2: navy gradient background behind the whole page */
        body {
            /* Poppins is the body font, with backups if Google Fonts is unavailable */
            font-family: 'Poppins', Arial, sans-serif;
            /* dark navy blend that gets slightly lighter toward the center */
            background: radial-gradient(circle at 50% 0%, #16305c 0%, #0b1b33 55%, #06101f 100%);
            /* light gray text so it reads against the dark background */
            color: #e8ecf4;
            /* keeps the background filling the screen even on short pages */
            min-height: 100vh;
            /* centers the card horizontally */
            display: flex;
            /* stacks the content vertically */
            flex-direction: column;
            /* centers the card left to right */
            align-items: center;
            /* breathing room at the top and bottom */
            padding: 48px 20px;
        }

        /* the gold rule that sits above the title */
        .eyebrow {
            /* small, spaced-out capitals for a label look */
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            /* gold accent color used throughout the page */
            color: #c9a227;
            /* space between the label and the title under it */
            margin-bottom: 10px;
        }

        /* the main page heading */
        h1 {
            /* Cinzel gives the title a carved, symmetrical feel that suits palindromes */
            font-family: 'Cinzel', Georgia, serif;
            /* large but still comfortable on a phone */
            font-size: 40px;
            /* soft white rather than pure white */
            color: #f5f7fb;
            /* space under the title */
            margin-bottom: 8px;
            /* centers the heading text */
            text-align: center;
        }

        /* the one-line explanation under the title */
        .subtitle {
            /* smaller and dimmer than the heading */
            font-size: 15px;
            color: #a8b4c8;
            /* light weight keeps it quiet next to the heading */
            font-weight: 300;
            /* space before the card starts */
            margin-bottom: 32px;
            text-align: center;
        }

        /* the card that holds the form and the results */
        .panel {
            /* slightly lighter navy so the card lifts off the background */
            background: #101f3a;
            /* thin gold-tinted border */
            border: 1px solid #2c3f63;
            /* rounded corners */
            border-radius: 14px;
            /* inner spacing */
            padding: 32px;
            /* keeps the card from stretching too wide on a desktop */
            width: 100%;
            max-width: 560px;
            /* soft glow so the card looks lit rather than flat */
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        }

        /* the label above the text box */
        label {
            /* puts the label on its own line above the input */
            display: block;
            /* small spaced capitals to match the eyebrow style */
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8fa0bd;
            /* gap between the label and the input */
            margin-bottom: 10px;
        }

        /* the text box the user types into */
        input[type="text"] {
            /* fills the full width of the card */
            width: 100%;
            /* comfortable click and tap target */
            padding: 14px 16px;
            /* readable typing size */
            font-size: 17px;
            /* matches the rest of the page */
            font-family: 'Poppins', Arial, sans-serif;
            /* dark field with a light border */
            background: #0a1830;
            border: 1px solid #35496f;
            border-radius: 8px;
            color: #ffffff;
        }

        /* highlights the text box while the user is typing in it */
        input[type="text"]:focus {
            /* gold border replaces the default browser outline */
            outline: none;
            border-color: #c9a227;
        }

        /* the gold submit button */
        button {
            /* full width so it is easy to hit on a phone */
            width: 100%;
            /* same height feel as the input above it */
            padding: 14px;
            /* space above the button */
            margin-top: 16px;
            /* gold background with dark navy text for contrast */
            background: #c9a227;
            color: #0b1b33;
            /* no default border */
            border: none;
            border-radius: 8px;
            /* bold, spaced capitals */
            font-family: 'Poppins', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            /* shows a hand cursor so it reads as clickable */
            cursor: pointer;
        }

        /* brightens the button when the mouse is over it */
        button:hover {
            background: #e0b62d;
        }

        /* grays out the button once the user exits the loop */
        button:disabled {
            background: #3a4560;
            color: #8994ab;
            cursor: not-allowed;
        }

        /* the box where all messages are written with innerHTML */
        .message {
            /* space between the form and the message */
            margin-top: 24px;
            /* readable message size */
            font-size: 16px;
            /* keeps long phrases from spilling outside the card */
            word-wrap: break-word;
        }

        /* green result line used when the string IS a palindrome */
        .yes {
            color: #6fdc9a;
            font-weight: 600;
        }

        /* amber result line used when the string is NOT a palindrome */
        .no {
            color: #f2a65a;
            font-weight: 600;
        }

        /* red line used for empty or invalid input */
        .warn {
            color: #f26a6a;
            font-weight: 600;
        }

        /* smaller gray line that shows the cleaned-up version of the string */
        .detail {
            font-size: 13px;
            color: #8fa0bd;
            margin-top: 6px;
        }

        /* CREATIVE ELEMENT 3: the row of letter tiles built by the JavaScript */
        .strip {
            /* lets the tiles wrap onto a second row for long phrases */
            display: flex;
            flex-wrap: wrap;
            /* small gap between tiles */
            gap: 6px;
            /* space above and below the tile row */
            margin: 16px 0;
        }

        /* one letter tile */
        .tile {
            /* fixed square size */
            width: 34px;
            height: 40px;
            /* centers the letter inside the tile */
            display: flex;
            align-items: center;
            justify-content: center;
            /* dark tile with a subtle border */
            background: #0a1830;
            border: 1px solid #35496f;
            border-radius: 6px;
            /* the serif face makes the mirrored letters easier to compare */
            font-family: 'Cinzel', Georgia, serif;
            font-size: 18px;
            text-transform: uppercase;
        }

        /* a tile whose mirror partner matches gets the gold treatment */
        .tile.match {
            border-color: #c9a227;
            color: #f2d47a;
            /* faint gold glow so matched pairs read as "connected" */
            box-shadow: 0 0 10px rgba(201, 162, 39, 0.35);
        }

        /* a tile whose mirror partner does not match turns red */
        .tile.break {
            border-color: #f26a6a;
            color: #f26a6a;
        }

        /* the yes/no question block that appears after each check */
        .again {
            /* hidden until the first word has been checked */
            display: none;
            /* space above it */
            margin-top: 24px;
            /* hairline divider between the result and the question */
            border-top: 1px solid #2c3f63;
            padding-top: 20px;
        }

        /* the question text above the radio buttons */
        .again p {
            font-size: 15px;
            margin-bottom: 12px;
        }

        /* each radio button and its wording sit on one line */
        .choice {
            /* keeps the dot and the words side by side */
            display: block;
            /* spacing between the two choices */
            margin-bottom: 8px;
            /* overrides the uppercase label styling above */
            text-transform: none;
            letter-spacing: normal;
            font-size: 15px;
            color: #e8ecf4;
            /* the whole line is clickable */
            cursor: pointer;
        }

        /* the running totals shown when the user exits */
        .summary {
            margin-top: 24px;
            padding: 18px;
            /* gold-tinted panel so the closing summary stands apart */
            background: #0a1830;
            border-left: 3px solid #c9a227;
            border-radius: 6px;
            font-size: 15px;
        }

        /* the small credit line at the bottom of the page */
        footer {
            margin-top: 28px;
            font-size: 12px;
            color: #64748f;
            text-align: center;
        }
    </style>
</head>

<!-- the body holds everything the user actually sees -->
<body>

    <!-- small gold label above the title -->
    <div class="eyebrow">CSC102 &bull; String Practice</div>

    <!-- the main heading for the page -->
    <h1>Palindrome Checker</h1>

    <!-- one line explaining what the page does -->
    <p class="subtitle">Type a word or phrase. I read it forward and backward and tell you if it matches.</p>

    <!-- the card holding the form, the results, and the follow-up question -->
    <div class="panel">

        <!-- the input form; onsubmit calls the function in palindrome.js and returns false so the page does not reload -->
        <form name="wordForm" onsubmit="return checkWord();">

            <!-- describes the text box for the user and for screen readers -->
            <label for="userText">Word or phrase</label>

            <!-- the text box the user types into; autocomplete is off so old entries do not pop up -->
            <input type="text" id="userText" name="userText" autocomplete="off" placeholder="Never odd or even">

            <!-- the submit button that runs the check -->
            <button type="submit" id="checkButton">Check it</button>

        </form>

        <!-- every message is written into this div with innerHTML - no alerts anywhere -->
        <div class="message" id="messageBox"></div>

        <!-- the follow-up question; the JavaScript switches this on after each check -->
        <div class="again" id="againBox">

            <!-- the question itself -->
            <p>Want to check another one?</p>

            <!-- second form so the yes/no answer is also handled by a submit -->
            <form name="againForm" onsubmit="return answerAgain();">

                <!-- the "keep going" choice, selected by default -->
                <label class="choice">
                    <input type="radio" name="again" value="yes" checked> Yes, I have another word
                </label>

                <!-- the "exit the loop" choice -->
                <label class="choice">
                    <input type="radio" name="again" value="no"> No, I am done
                </label>

                <!-- submits the yes/no answer -->
                <button type="submit" id="againButton">Continue</button>

            </form>
        </div>

    </div>

    <!-- credit line at the bottom of the page -->
    <footer>Built by Larry Douglas &bull; CSC102</footer>

    <!-- loads the JavaScript file; all functions live there, none are written inside this HTML file -->
    <script src="palindrome.js"></script>

</body>
</html>
